<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaires</title></head><body hidden><form class="cform" name="contact" method="POST" action="/merci/" data-netlify="true" netlify-honeypot="bot-field" data-contact-form novalidate><input type="hidden" name="form-name" value="contact"><p class="hp" aria-hidden="true"><label>Ne pas remplir <input name="bot-field" tabindex="-1" autocomplete="off"></label></p><h3 class="cform-title">Écrivez-nous</h3><p class="cform-intro">Décrivez votre besoin : nous revenons vers vous avec une proposition technique et un devis détaillé.</p><div class="cform-grid"><div class="f"><label for="cf-nom">Nom et prénom <span class="req" aria-hidden="true">*</span></label><input id="cf-nom" name="nom" type="text" autocomplete="name" required maxlength="120"></div><div class="f"><label for="cf-societe">Société / organisme</label><input id="cf-societe" name="societe" type="text" autocomplete="organization" maxlength="160"></div><div class="f"><label for="cf-email">E-mail <span class="req" aria-hidden="true">*</span></label><input id="cf-email" name="email" type="email" autocomplete="email" required maxlength="160"></div><div class="f"><label for="cf-tel">Téléphone</label><input id="cf-tel" name="telephone" type="tel" autocomplete="tel" maxlength="40" inputmode="tel"></div><div class="f f--full"><label for="cf-sujet">Objet de la demande <span class="req" aria-hidden="true">*</span></label><select id="cf-sujet" name="sujet" required><option value="">Choisir…</option><option>Demande de devis</option><option>Étude et ingénierie</option><option>Travaux industriels</option><option>Maintenance industrielle</option><option>Fourniture d&#39;équipements</option><option>Quincaillerie et matériaux</option><option>Autre demande</option></select></div><div class="f f--full"><label for="cf-message">Votre message <span class="req" aria-hidden="true">*</span></label><textarea id="cf-message" name="message" rows="5" required minlength="10" maxlength="4000"></textarea></div><div class="f f--full f--check"><input id="cf-consent" name="consentement" type="checkbox" value="oui" required><label for="cf-consent">J&#39;accepte que mes informations soient utilisées pour traiter ma demande.</label></div></div><div class="cform-foot"><button class="btn btn-primary btn-lg" type="submit">Envoyer le message</button><p class="cform-status" role="status" aria-live="polite" data-form-status></p></div><p class="cform-success" data-form-success hidden>Merci, votre message a bien été transmis. Nous vous répondons dans les meilleurs délais.</p></form></body></html>
